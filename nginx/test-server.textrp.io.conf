# Nginx reverse proxy for Synapse (briij) at test-server.textrp.io with SSL
# Proxies client (443) and federation (8448) to localhost:8008.
# Requires certificates at /etc/letsencrypt/live/test-server.textrp.io/ (e.g. from certbot).
#
# If /docs/ returns 404 but this config has the docs location, another server block is
# handling the request (e.g. from /etc/nginx/conf.d/). Find it:
#   sudo nginx -T 2>/dev/null | grep -E "listen.*443|server_name" | head -40
# Fix: disable the conflicting default (e.g. sudo mv /etc/nginx/conf.d/default.conf
#   /etc/nginx/conf.d/default.conf.bak), or copy this file to
#   /etc/nginx/conf.d/00-test-server.textrp.io.conf so this server is loaded first.
#
# Install: copy to sites-available (keep .conf so nginx includes it), enable, reload:
#   sudo cp nginx/test-server.textrp.io.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/test-server.textrp.io.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# If you still see the default page, check: grep -r "include.*sites-enabled" /etc/nginx/nginx.conf
# (if it uses "*.conf" then the filename must end in .conf)
#
# Prerequisites:
# - Synapse on 127.0.0.1:8008; homeserver.yaml: x_forwarded: true
# - Docs: build then deploy static files (see comments above location /docs/).

# HTTP: redirect to HTTPS (except ACME challenge for certbot renewal)
server {
    listen 80;
    listen [::]:80;

    server_name test-server.textrp.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: client traffic
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name test-server.textrp.io;

    # If you see this header, this server block is handling the request
    add_header X-Test-Server-Block "1" always;

    ssl_certificate     /etc/letsencrypt/live/test-server.textrp.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-server.textrp.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Redirect root to static client
    location = / {
        return 301 /_matrix/static/;
    }

    # Docs: static files. Deploy first (from repo root):
    #   ./scripts-dev/build-docs-test-server.sh
    #   sudo mkdir -p /var/www/test-server-docs/docs
    #   sudo rsync -av --delete book/ /var/www/test-server-docs/docs/
    location = /docs {
        return 301 $scheme://$host/docs/;
    }
    location = /docs/ {
        return 302 $scheme://$host/docs/index.html;
    }
    location /docs/ {
        alias /var/www/test-server-docs/docs/;
    }

    # All other paths go to Synapse
    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host:$server_port;

        client_max_body_size 50M;
        proxy_http_version 1.1;
    }
}

# Federation note:
# If another service already listens on 8448 (e.g. Synapse directly), do not bind 8448 in nginx.
# Re-add a dedicated 8448 server block only when 8448 is free and you want nginx to terminate TLS for federation.
