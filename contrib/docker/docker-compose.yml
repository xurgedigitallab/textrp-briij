# This compose file is compatible with Compose itself, it might need some
# adjustments to run properly with stack.

services:

  textrp_briij:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: textrp-briij:testing
    # Since briij does not retry to connect to the database, restart upon
    # failure
    restart: unless-stopped
    # See the readme for a full documentation of the environment settings
    # NOTE: You must edit homeserver.yaml to use postgres, it defaults to sqlite
    environment:
      - BRIIJ_CONFIG_PATH=/data/homeserver.yaml
    volumes:
      # You may either store all the files in a local folder
      - ./files:/data
      # .. or you may split this between different storage points
      # - ./files:/data
      # - /path/to/ssd:/data/uploads
      # - /path/to/large_hdd:/data/media
    depends_on:
      - db
    # In order to expose Briij by TextRP, remove one of the following, you might for
    # instance expose the TLS port directly:
    ports:
      - 8008:8008/tcp
      - 8448:8448/tcp
    # ... or use a reverse proxy, here is an example for traefik:
    labels:
      # The following lines are valid for Traefik version 1.x:
      - traefik.enable=true
      - traefik.frontend.rule=Host:test-client.textrp.io
      - traefik.port=8008
      # Alternatively, for Traefik version 2.0:
      - traefik.enable=true
      - traefik.http.routers.http-textrp-briij.entryPoints=http
      - traefik.http.routers.http-textrp-briij.rule=Host(`test-server.textrp.io`)
      - traefik.http.middlewares.https_redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https_redirect.redirectscheme.permanent=true
      - traefik.http.routers.http-textrp-briij.middlewares=https_redirect
      - traefik.http.routers.https-textrp-briij.entryPoints=https
      - traefik.http.routers.https-textrp-briij.rule=Host(`test-server.textrp.io`)
      - traefik.http.routers.https-textrp-briij.service=textrp_briij
      - traefik.http.routers.https-textrp-briij.tls=true
      - traefik.http.services.textrp_briij.loadbalancer.server.port=8008
      - traefik.http.routers.https-textrp-briij.tls.certResolver=le-ssl

  db:
    image: docker.io/postgres:15-alpine
    # Change that password, of course!
    environment:
      - POSTGRES_DB=briij-testing
      - POSTGRES_USER=briij-testing
      - POSTGRES_PASSWORD=testpassword123
      # ensure the database gets created correctly
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - briij-testing-postgres:/var/lib/postgresql/data
      - ../../init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

volumes:
  briij-testing-postgres: