<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Briij by TextRP is running</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --textrp-primary: #5B3D8B;
        --textrp-primary-light: #7B5DAB;
        --textrp-primary-dark: #4A3080;
        --textrp-gray-900: #1f2933;
        --textrp-gray-600: #52606d;
        --textrp-gray-400: #7b8794;
        --textrp-gray-200: #e4e7eb;
        --textrp-gray-100: #f1f3f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        color: var(--textrp-gray-900);
        background-color: #fff;
        max-width: 40em;
        margin: 0 auto;
        padding: 3rem 1.5rem;
        text-align: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .logo-mark {
        display: inline-block;
        margin-bottom: 3rem;
        text-decoration: none;
        color: var(--textrp-primary);
      }

      .logo-mark:hover {
        opacity: 0.9;
      }

      .logo-mark img {
        display: block;
        max-width: 240px;
        height: auto;
        max-height: 64px;
        width: auto;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--textrp-primary);
        margin: 0 0 1rem;
        line-height: 1.3;
      }

      .subtitle {
        font-size: 1rem;
        font-weight: 500;
        color: var(--textrp-gray-600);
        margin: 0 0 2rem;
      }

      p {
        font-size: 0.9375rem;
        line-height: 1.6;
        color: var(--textrp-gray-600);
        margin: 0 0 1rem;
      }

      a {
        color: var(--textrp-primary);
        font-weight: 500;
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color 0.15s ease, border-color 0.15s ease;
      }

      a:hover {
        color: var(--textrp-primary-dark);
        border-bottom-color: var(--textrp-primary-dark);
      }

      hr {
        border: none;
        background-color: var(--textrp-gray-200);
        height: 1px;
        width: 6rem;
        margin: 2.5rem auto;
      }

      .footer {
        margin-top: auto;
      }

      .footer a {
        font-size: 0.875rem;
        color: var(--textrp-gray-400);
      }

      .footer a:hover {
        color: var(--textrp-primary);
      }
    </style>
  </head>
  <body>
    <a href="https://textrp.io" class="logo-mark" target="_blank" rel="noopener noreferrer" aria-label="Briij by TextRP">
      <img src="briij-logo.png" alt="Briij by TextRP" width="240" height="64">
    </a>

    <h1>It works! Briij by TextRP is running</h1>
    <p class="subtitle">Your server is listening on this port and is ready for messages.</p>
    <p>To use this server you'll need <a href="https://matrix.org/ecosystem/clients/" target="_blank" rel="noopener noreferrer">a TextRP client</a>.</p>
    <p>Welcome to the TextRP ecosystem.</p>

    <hr>

    <p class="footer">
      <a href="https://textrp.io" target="_blank" rel="noopener noreferrer">textrp.io</a>
    </p>
  </body>
</html>
