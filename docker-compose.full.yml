services:

  # --- Infrastructure ---

  postgres:
    image: docker.io/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: briij-testing
      POSTGRES_USER: briij-testing
      POSTGRES_PASSWORD: testpassword123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - briij-testing-postgres:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briij-testing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Core: Synapse Homeserver (textrp-briij) ---

  briij:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      UID: "1000"
      GID: "1000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  textrp-mobile-chat:
    build:
      context: ./textrp-mobile-chat
      args:
        NEXT_PUBLIC_MATRIX_HOMESERVER_URL: http://briij:8008
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_MATRIX_HOMESERVER_URL: http://briij:8008
    depends_on:
      briij:
        condition: service_healthy
    ports:
      - "3002:3001"

volumes:
  briij-testing-postgres:
