services:

  # --- Infrastructure ---

  postgres:
    image: docker.io/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: change_me
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Core: Synapse Homeserver (textrp-briij) ---

  briij:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      UID: "1000"
      GID: "1000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Backend: XRPL Proxy API (placeholder) ---

  textrpv2-api:
    build:
      context: ./textrpv2-api
    restart: unless-stopped
    environment:
      PORT: "3001"
      XRPL_NETWORK: testnet
      BRIJ_HOMESERVER_URL: http://briij:8008
      XRPL_TESTNET: "1"
      DHALI_PAY_API_KEY: placeholder
    depends_on:
      briij:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- IdP: OIDC Provider for Xaman SSO (placeholder) ---

  textrp-connect:
    build:
      context: ./textrp-connect
    restart: unless-stopped
    environment:
      PORT: "8080"
      XAMAN_CLIENT_ID: placeholder_client_id
      XAMAN_CLIENT_SECRET: placeholder_client_secret
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Frontend: React/TS client (placeholder) ---

  textrp-mobile-chat:
    build:
      context: ./textrp-mobile-chat
    restart: unless-stopped
    environment:
      MATRIX_HOMESERVER_URL: http://localhost:8008
      OIDC_ISSUER: http://localhost:8080
      API_BASE: http://localhost:3001
    depends_on:
      briij:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  synapse-postgres:
