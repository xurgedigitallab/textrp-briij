services:

  # --- Infrastructure ---

  postgres:
    image: docker.io/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: change_me
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse-postgres:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Core: Synapse Homeserver (textrp-briij) ---

  briij:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      UID: "1000"
      GID: "1000"
      BRIIJ_XRPL_AUTH_ENABLED: "true"
      BRIIJ_XRPL_ALLOW_ACCOUNT_CREATION: "true"
      BRIIJ_XRPL_NODE_URL: "https://s.altnet.rippletest.net:51234"
      BRIIJ_XAHAU_NODE_URL: "https://xahau-testnet.xrpl-labs.com"
      BRIIJ_XRPL_CHALLENGE_TTL_SECONDS: "300"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Backend: XRPL Proxy API (AdonisJS) ---

  textrpv2-api:
    build:
      context: ./textrpv2-api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "8080"
      HOST: "0.0.0.0"
      LOG_LEVEL: debug
      APP_KEY: efe658c0be5c5297bb9ea69f57d952701f7d303aa19613c29f2feb2add0fcdcf
      APP_URL: http://api:8080/v2
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: synapse
      DB_PASSWORD: change_me
      DB_DATABASE: textrp_v2
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      JWT_SECRET: LxNh8zaINTAEdU1+GCIabj6gBvICmkZvdwYs4a9KAnM=
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      IDP_JWT_SECRET: LxNh8zaINTAEdU1+GCIabj6gBvICmkZvdwYs4a9KAnM=
      IDENTITY_PROVIDER_URL: http://textrp-connect:3000
      IDP_CLIENT_ID: ${IDP_CLIENT_ID:-placeholder_client_id}
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET:-placeholder_client_secret}
      CLIENT_REDIRECT_URL: http://localhost:8080/v2/sso/callback
      XRPL_NETWORK: testnet
      XRPL_WEBSOCKET_URL: wss://s.altnet.rippletest.net:51233
      CHOKIDAR_USEPOLLING: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      briij:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8080/v2/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- IdP: OIDC Provider / Xaman SSO (Next.js) ---

  textrp-connect:
    build:
      context: ./textrp-connect
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      XUMM_KEY: ${XUMM_KEY:-placeholder}
      XUMM_KEY_SECRET: ${XUMM_KEY_SECRET:-placeholder}
      ENC_KEY: LxNh8zaINTAEdU1+GCIabj6gBvICmkZvdwYs4a9KAnM=
      JWT_ISSUER: xrpl-wallet-connect
      JWT_AUDIENCE: textrp-synapse
      MATRIX_SERVER_NAME: "localhost:8008"
      MATRIX_JWT_SECRET: LxNh8zaINTAEdU1+GCIabj6gBvICmkZvdwYs4a9KAnM=
      MATRIX_JWT_ALGORITHM: HS256
      MATRIX_JWT_ISSUER: xrpl-identity-server
      MATRIX_JWT_AUDIENCE: matrix
      MATRIX_HOMESERVER_URL: http://briij:8008
      SYNAPSE_BASE_URL: http://briij:8008
      WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:-ec2949b75462c008b21e0af5e2e1b83a}
      TEXTRP_BACKEND_URL: http://textrpv2-api:8080
    volumes:
      - connect-data:/app/.data
    depends_on:
      briij:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Frontend: React/TS Matrix Client (Next.js) ---

  textrp-mobile-chat:
    build:
      context: ./textrp-mobile-chat
      args:
        NEXT_PUBLIC_TEXTRP_BACKEND_URL: http://textrpv2-api:8080
        NEXT_PUBLIC_MATRIX_HOMESERVER_URL: http://briij:8008
        NEXT_PUBLIC_WALLET_API_URL: http://textrp-connect:3000
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_TEXTRP_BACKEND_URL: http://textrpv2-api:8080
      NEXT_PUBLIC_MATRIX_HOMESERVER_URL: http://briij:8008
      NEXT_PUBLIC_WALLET_API_URL: http://textrp-connect:3000
    depends_on:
      briij:
        condition: service_healthy
    ports:
      - "3002:3001"

volumes:
  synapse-postgres:
  connect-data:
